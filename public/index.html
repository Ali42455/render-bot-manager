<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Render Management Dashboard</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1100px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 i {
            color: var(--accent-color);
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        /* Cards Grid */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: rgba(79, 70, 229, 0.1);
            color: var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }

        .card-info h3 {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .card-info p {
            font-size: 18px;
            font-weight: 700;
        }

        /* Action Commands Panel */
        .commands-panel {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .commands-panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            color: white;
            font-size: 14px;
        }

        .btn-deploy { background-color: var(--accent-color); }
        .btn-deploy:hover { background-color: var(--accent-hover); }

        .btn-restart { background-color: var(--warning-color); color: #000; }
        .btn-restart:hover { filter: brightness(0.9); }

        .btn-suspend { background-color: var(--danger-color); }
        .btn-suspend:hover { filter: brightness(0.9); }

        .btn-resume { background-color: var(--success-color); }
        .btn-resume:hover { filter: brightness(0.9); }

        /* Terminal Console */
        .terminal-panel {
            background-color: #070a11;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .terminal-logs {
            height: 200px;
            overflow-y: auto;
            font-size: 13px;
            color: #38bdf8;
            line-height: 1.6;
        }

        .log-entry { margin-bottom: 4px; }
        .log-entry.success { color: var(--success-color); }
        .log-entry.error { color: var(--danger-color); }
    </style>
</head>
<body>

<div class="dashboard-container">

    <!-- Header -->
    <header>
        <h1><i class="fa-solid fa-server"></i> Render Control Center</h1>
        <div class="status-badge" id="statusBadge">
            <i class="fa-solid fa-circle-dot"></i> <span id="statusText">Checking Status...</span>
        </div>
    </header>

    <!-- Cards Grid -->
    <div class="grid-cards">
        <div class="card">
            <div class="card-icon"><i class="fa-solid fa-cube"></i></div>
            <div class="card-info">
                <h3>Service Name</h3>
                <p id="serviceName">Bybit Trading Bot</p>
            </div>
        </div>
        <div class="card">
            <div class="card-icon"><i class="fa-solid fa-globe"></i></div>
            <div class="card-info">
                <h3>Region</h3>
                <p id="serviceRegion">Frankfurt (EU)</p>
            </div>
        </div>
        <div class="card">
            <div class="card-icon"><i class="fa-solid fa-rotate"></i></div>
            <div class="card-info">
                <h3>Auto Deploy</h3>
                <p id="autoDeploy">Enabled</p>
            </div>
        </div>
    </div>

    <!-- Commands Section -->
    <div class="commands-panel">
        <h2><i class="fa-solid fa-terminal"></i> Render Executable Commands</h2>
        <div class="btn-group">
            <button class="btn btn-deploy" onclick="sendCommand('deploy')">
                <i class="fa-solid fa-rocket"></i> Manual Deploy
            </button>
            <button class="btn btn-restart" onclick="sendCommand('restart')">
                <i class="fa-solid fa-arrows-rotate"></i> Restart Service
            </button>
            <button class="btn btn-suspend" onclick="sendCommand('suspend')">
                <i class="fa-solid fa-pause"></i> Suspend Service
            </button>
            <button class="btn btn-resume" onclick="sendCommand('resume')">
                <i class="fa-solid fa-play"></i> Resume Service
            </button>
        </div>
    </div>

    <!-- Console / Terminal Panel -->
    <div class="terminal-panel">
        <div class="terminal-header">
            <span><i class="fa-solid fa-code"></i> Live Output Console</span>
            <span id="currentTime"></span>
        </div>
        <div class="terminal-logs" id="logsContainer">
            <div class="log-entry">[System] Render Dashboard Ready. Monitoring API...</div>
        </div>
    </div>

</div>

<script>
    const logsContainer = document.getElementById('logsContainer');

    function addLog(msg, type = 'info') {
        const div = document.createElement('div');
        div.className = `log-entry ${type}`;
        const time = new Date().toLocaleTimeString();
        div.innerText = `[${time}] ${msg}`;
        logsContainer.appendChild(div);
        logsContainer.scrollTop = logsContainer.scrollHeight;
    }

    async function checkStatus() {
        try {
            const res = await fetch('/api/status');
            const result = await res.json();
            if (result.success) {
                document.getElementById('statusText').innerText = result.data.status.toUpperCase();
                addLog(`Status Updated: ${result.data.status}`, 'success');
            } else {
                addLog(`Error fetching status: ${JSON.stringify(result.error)}`, 'error');
            }
        } catch (err) {
            addLog(`Server connection error: ${err.message}`, 'error');
        }
    }

    async function sendCommand(action) {
        addLog(`Executing command: ${action.toUpperCase()}...`);
        try {
            const res = await fetch(`/api/${action}`, { method: 'POST' });
            const result = await res.json();
            if (result.success) {
                addLog(result.message, 'success');
                checkStatus();
            } else {
                addLog(`Command failed: ${JSON.stringify(result.error)}`, 'error');
            }
        } catch (err) {
            addLog(`Failed to communicate with Server API: ${err.message}`, 'error');
        }
    }

    // Initial fetch and clock
    document.getElementById('currentTime').innerText = new Date().toLocaleDateString();
    checkStatus();
</script>

</body>
</html>
